version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - git fetch --unshallow || test "$(git rev-parse --is-shallow-repository)" = false
      - git fetch --tags
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
